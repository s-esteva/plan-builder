<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0c10">
<title>VHIL plan builder</title>

<!-- GENERATED by build.js from src/ (variant C, Tabs). Needs beats.js next to this file; works offline, no network calls. -->
<style>
*{box-sizing:border-box}
:root{
  /* Colours by meaning only (ADR-0003). Category fills come from beats.js; nothing else is invented. */
  --page:#0b0c10;                 /* page */
  --surface:#1b1e24;              /* bars and headers (the light end of the page range) */
  --panel:rgba(18,20,28,.9);      /* host panel */
  --text:#E8EBF2;                 /* primary text */
  --muted:#B8C2D6;                /* muted text */
  --btn:#353a44;                  /* utility button gray, as in the scan-button round (117) */
  --btn-hi:#454b57;
  --line:#3a4048;
  --red:#A32D2D;                  /* destructive: remove and Clear only */
  --slide:cubic-bezier(.3,.7,.3,1);
  --font:"Liberation Sans",Arial,Helvetica,sans-serif;
}
html,body{height:100%;margin:0}
body{
  background:var(--page);color:var(--text);font:400 14px/1.35 var(--font);
  display:flex;flex-direction:column;overflow:hidden;
  -webkit-text-size-adjust:100%;overscroll-behavior:none;
}
b,strong,h1,h2,h3,h4,th{font-weight:500}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input{font:inherit;color:inherit}
kbd{font:inherit}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition-duration:0s!important;animation-duration:0s!important}}

/* ---- the page: the shared parts (identical in every variant) and variant A's palette ---- */
.page{
  position:absolute;inset:0;container:pg/inline-size;overflow:hidden;background:var(--page);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
/* phone: name and sequence on top, the palette in the middle, a sticky bar at the bottom.
   The sequence takes what it needs and no more than what is left after the palette's floor (--palmin): past that it scrolls inside. */
.pgrid{
  position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto minmax(0,max-content) minmax(var(--palmin,200px),1fr) auto;
  grid-template-areas:"head" "seq" "pal" "bar";
}
.pgrid>*{min-width:0}
.rcol{display:contents}

/* a beat is always a circle: its category fill, the white glyph at 74% */
.c{display:grid;place-items:center;border-radius:50%;background:var(--fill);flex:none}
.c>img{width:74%;height:74%;pointer-events:none;-webkit-user-drag:none;user-select:none}

/* buttons */
.btn{height:44px;padding:0 16px;border-radius:6px;background:var(--btn);color:var(--text);font-size:14px;transition:background .2s,opacity .3s;white-space:nowrap}
.btn:hover{background:var(--btn-hi)}
.btn[disabled]{opacity:.4;pointer-events:none}
.txtbtn{height:36px;padding:0 9px;border-radius:6px;color:var(--muted);font-size:13px;white-space:nowrap;transition:color .2s,background .2s,opacity .3s}
.txtbtn:hover{color:var(--text);background:rgba(255,255,255,.06)}
.txtbtn.danger:hover{background:var(--red);color:var(--text)}
.txtbtn[disabled]{opacity:.35;pointer-events:none}

/* name + Example + Clear */
.head{grid-area:head;display:flex;align-items:center;gap:2px;padding:12px 8px 0 12px}
.name{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;margin-right:4px;border-radius:8px;background:var(--panel);box-shadow:inset 0 0 0 1px transparent;transition:box-shadow .2s}
.name:focus-within{box-shadow:inset 0 0 0 1px var(--muted)}
.name span{color:var(--muted);font-size:13px;flex:none}
.name input{flex:1;min-width:0;height:100%;padding:0;background:none;border:0;outline:0;font-size:16px;color:var(--text);-webkit-user-select:text;user-select:text}
.name input::placeholder{color:var(--muted);opacity:.5}

/* the sequence: panel > scroller > content; the tiles sit absolutely inside content */
.seq{grid-area:seq;min-height:0;padding:12px 12px 0;display:flex;flex-direction:column}
.panel{position:relative;display:flex;flex-direction:column;flex:0 1 auto;min-height:0;background:var(--panel);border-radius:10px;transition:background-color .3s}
.panel::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 2px var(--red);opacity:0;pointer-events:none;transition:opacity .3s}
.panel.out{background:rgba(163,45,45,.28)}
.panel.out::after{opacity:1}
.scroll{position:relative;flex:1 1 auto;min-height:0;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--btn-hi) transparent}
.scroll[data-axis=y]{overflow-x:hidden;overflow-y:auto;scrollbar-gutter:stable}
.scroll[data-axis=x]{overflow-x:auto;overflow-y:hidden}
.content{position:relative}
.content.anim{transition:height .45s var(--slide)}

/* a beat in the sequence */
.tile{
  position:absolute;left:0;top:0;transform-origin:50% 50%;touch-action:none;cursor:grab;
  transition:transform .45s var(--slide),width .45s var(--slide),height .45s var(--slide),opacity .3s;
}
.tile.dot{border-radius:50%;background:var(--fill);display:grid;place-items:center}
.tile.dot>img{width:74%;height:74%;pointer-events:none;-webkit-user-drag:none}
.tile.pending{opacity:0;pointer-events:none}
.tile.lifted{visibility:hidden}
.tile.gone{opacity:0;pointer-events:none}
/* when the sequence scrolls, a finger on a beat scrolls it; a press-and-hold (or a pull across) picks the beat up */
.scroll[data-axis=y].can .tile{touch-action:pan-y}
.scroll[data-axis=x].can .tile{touch-action:pan-x}
.tile .x{
  position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;
  background:var(--surface);color:var(--muted);box-shadow:0 0 0 1px var(--line);
  display:none;place-items:center;cursor:pointer;z-index:2;touch-action:manipulation;
}
.tile .x:hover{background:var(--red);color:var(--text);box-shadow:none}
@media (hover:hover){.tile:hover .x{display:grid}}
html.dragging .tile .x{display:none!important}
html.dragging,html.dragging *{cursor:grabbing!important}

/* the lifted beat and the glide */
.tile.ghost{z-index:40;pointer-events:none;opacity:.92;transition:opacity .3s,filter .3s;cursor:grabbing}
.tile.ghost.leaving{filter:grayscale(1);opacity:.5}
.flyer{position:absolute;left:0;top:0;z-index:40;pointer-events:none;transform-origin:0 0;transition:opacity .3s}

/* the palette */
.pal{grid-area:pal;min-height:0;min-width:0}
.cell{display:flex;flex-direction:column;align-items:center;gap:5px;width:100%;max-width:84px;padding:2px 0 0;touch-action:pan-y;cursor:pointer}
.cell .c{width:52px;height:52px;transition:transform .1s,filter .2s}
.cell:active .c{transform:scale(.94)}
.cell .lbl{display:block;width:100%;overflow:hidden;white-space:nowrap;text-align:center;font-size:11px;line-height:1.2;color:var(--muted);transition:color .2s}
@media (hover:hover){
  .cell:hover .c{filter:brightness(1.14)}
  .cell:hover .lbl{color:var(--text)}
}
/* every beat in category rows (A, and D's sheet) */
.pal-rows{height:100%;overflow-y:auto;padding:0 12px 14px;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--btn-hi) transparent}
.catH{position:sticky;top:0;z-index:2;background:var(--page);padding:12px 0 6px;font-size:12px;font-weight:500;letter-spacing:.04em;color:var(--muted)}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px 4px;justify-items:center}

/* bottom bar: counter, Show code, QR preview */
.bar{
  grid-area:bar;display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"count btn qr";align-items:center;column-gap:12px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--surface);box-shadow:0 -1px 0 rgba(255,255,255,.05);
}
.count{grid-area:count;font-size:18px;font-weight:500;font-variant-numeric:tabular-nums;min-width:3.4em}
.count .of{color:var(--muted);font-weight:400}
.count.nudge{animation:nudge .3s}
@keyframes nudge{from{opacity:.25}to{opacity:1}}
.bar .btn{grid-area:btn;justify-self:end}
.qr{grid-area:qr;width:56px;height:56px;border-radius:6px;background:#fff;display:grid;place-items:center;overflow:hidden;cursor:pointer;transition:opacity .3s}
.qr canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.bar.empty .qr{opacity:.18;pointer-events:none}

/* Show code: big, black on white with its quiet zone, tap to close */
.codeov{position:absolute;inset:0;z-index:60;background:#fff;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .3s;cursor:pointer}
.codeov.on{opacity:1;pointer-events:auto}
.codeov canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}

/* ---- desktop: the palette on the left, the sequence and the QR on the right ---- */
@container pg (min-width:760px){
  .pgrid{
    grid-template-columns:minmax(0,760px) minmax(420px,480px);justify-content:center;
    grid-template-rows:minmax(0,1fr);grid-template-areas:"pal rcol";column-gap:32px;padding:20px 28px;
  }
  .rcol{grid-area:rcol;display:flex;flex-direction:column;gap:12px;min-height:0}
  .head{padding:0}
  .seq{padding:0;flex:0 1 auto}
  .bar{
    flex:none;grid-template-columns:auto 1fr;grid-template-areas:"qr count" "qr btn";column-gap:16px;row-gap:10px;align-items:stretch;
    padding:14px;border-radius:10px;background:var(--panel);box-shadow:none;
  }
  .qr{justify-self:start;width:168px;height:168px;border-radius:8px}
  .count{align-self:start}
  .bar .btn{justify-self:stretch;align-self:end}
  .cell{max-width:88px}
  .cell .c{width:60px;height:60px}
  .cell .lbl{font-size:12px}
  .pal-rows{padding:0 10px 0 0}
  .catH{padding-top:2px}
  section+section .catH{padding-top:20px}
}

/* a phone on its side: the desktop layout in a short window */
@media (max-height:560px){
  @container pg (min-width:760px){
    .pgrid{padding:12px 20px}
    .seq{min-height:96px}
    .qr{width:120px;height:120px}
    .bar{padding:12px}
  }
}
/* the hover name over a sequence circle (10-layouts.js, tipFor) */
.tip{position:fixed;left:0;top:0;transform:translate(-50%,-100%);pointer-events:none;z-index:60;background:rgba(18,20,28,.96);color:var(--text);font-size:12px;line-height:1;padding:6px 9px;border-radius:6px;white-space:nowrap;opacity:0;transition:opacity .15s}
.tip.on{opacity:1}
/* Share, under the big code */
.codeov .share{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);min-width:132px}

/* ================= C. tabs ================= */
.v-C{--palmin:260px}
.pal-tabs{height:100%;display:flex;flex-direction:column;min-height:0}
.chips{flex:none;display:flex;gap:6px;padding:12px 12px 4px}
.chip{
  flex:1 1 0;min-width:0;height:40px;border-radius:8px;background:var(--surface);color:var(--muted);font-size:13px;
  position:relative;overflow:hidden;transition:background-color .3s,color .3s;
}
.chip::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--fill);transition:opacity .3s}
.chip.on{background:var(--fill);color:#fff}
.chip.on::after{opacity:0}
@media (hover:hover){.chip:not(.on):hover{color:var(--text)}}
.gridwrap{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--btn-hi) transparent}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 6px;padding:10px 12px 16px;align-content:start;animation:fade .3s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.grid3 .cell{max-width:none}
.grid3 .cell .c{width:76px;height:76px}
.grid3 .cell .lbl{font-size:12px}

@container pg (min-width:760px){
  .chips{padding:0 0 6px;gap:8px}
  .chip{height:44px;font-size:14px}
  .gridwrap{padding-right:6px}
  .grid3{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:20px 10px;padding:14px 0 20px}
  .grid3 .cell .c{width:84px;height:84px}
  .grid3 .cell .lbl{font-size:13px}
}
/* "All": option A's rows inside C's scrolling area (one scroller, so the category names still stick) */
.gridwrap .all{animation:fade .3s}
.gridwrap .all .pal-rows{height:auto;overflow:visible;padding:4px 12px 16px}

.page{position:fixed}
</style>

<script>
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

    const content = this.content = el('div', 'content');
    scroller.append(content); panel.append(scroller); seq.append(panel);
    const unpin = () => { this._pin++; };                                   // the user takes over the scroll
    scroller.addEventListener('wheel', unpin, { passive: true });
    scroller.addEventListener('pointerdown', unpin, true);
    content.addEventListener('transitionend', e => { if (e.target === content) this.updateScrolls(); });

    // the palette (per variant)
    const pal = this.pal = el('div', 'pal');
    this.spec.palette(this, pal);

    // bottom bar: counter, Show code, QR preview
    const bar = this.bar = el('div', 'bar');
    this.countEl = el('div', 'count', '<span class="n">0</span><span class="of">/' + MAX_BEATS + '</span>');
    this.nEl = this.countEl.firstChild;
    this.codeBtn = el('button', 'btn', 'Show code'); this.codeBtn.type = 'button';
    this.codeBtn.addEventListener('click', () => this.openCode());
    this.qrBox = el('div', 'qr'); this.qrBox.setAttribute('role', 'button'); this.qrBox.setAttribute('aria-label', 'Show code');
    this.qrCanvas = el('canvas'); this.qrBox.append(this.qrCanvas);
    this.qrBox.addEventListener('click', () => this.openCode());
    bar.append(this.countEl, this.codeBtn, this.qrBox);

    rcol.append(head, seq, bar);
    g.append(rcol, pal);

    // Show code: big black-on-white code, tap anywhere to close
    this.overlay = el('div', 'codeov'); this.overlay.setAttribute('aria-label', 'Code');
    this.ovCanvas = el('canvas'); this.overlay.append(this.ovCanvas);
    // Share (Sebastian, 2026-10-04): the plan as a link that reopens it, through the phone's share sheet, or copied
    this.shareBtn = el('button', 'btn share', 'Share'); this.shareBtn.type = 'button';
    this.shareBtn.addEventListener('click', e => { e.stopPropagation(); sharePlan(this, this.shareBtn); });
    this.overlay.append(this.shareBtn);
    this.overlay.addEventListener('click', () => this.closeCode());
    root.append(this.overlay);

    root.addEventListener('pointerdown', e => { this._ptype = e.pointerType; }, true);
    root.addEventListener('contextmenu', e => { if (this._ptype !== 'mouse' && !(e.target.closest && e.target.closest('input'))) e.preventDefault(); });
    this.ro = new ResizeObserver(() => this.onResize());
    this.ro.observe(root); this.ro.observe(scroller);
    this.refresh();
  }

  seqW() { return this.scroller.clientWidth; }
  visible() { return this.root.clientWidth > 0; }

  onResize() {
    const rw = this.root.clientWidth, rh = this.root.clientHeight;
    if (!rw) return;                                                   // hidden (another variant is in Full)
    const tier = rw >= WIDE_AT ? 'wide' : 'narrow', W = this.seqW();
    if (!this._init || this._dirty || tier !== this.tier || W !== this._W || rh !== this._rh) {
      this.tier = tier; this.root.dataset.tier = tier;
      this._W = W; this._rh = rh; this._init = true;
      this.relayout();
      if (this.spec.onResize) this.spec.onResize(this);
    }
    this.updateScrolls();
    const qb = this.qrBox.clientWidth;
    if (qb !== this._qb) { this._qb = qb; this.paintQR(); }
    if (this.overlay.classList.contains('on')) this.paintOverlay();
  }

  /* ----- layout of the sequence ----- */
  applyAxis() {
    const a = this.view.axis(this);
    if (a === this._axis) return;
    this._axis = a; this.scroller.dataset.axis = a;
    this.content.classList.toggle('anim', a !== 'x');                  // the strip never changes height
    this.scroller.scrollTop = 0; this.scroller.scrollLeft = 0;
  }
  relayout(o) {
    o = o || {};
    const W = this.seqW();
    if (!W) { this._dirty = true; return; }
    this._dirty = false;
    this.applyAxis();
    const list = this.items.filter(it => it !== o.skip);
    if (o.gapAt != null) list.splice(o.gapAt, 0, null);                // the gap is an empty slot
    const L = this.L = this.view.layout(this, list.length, W);
    list.forEach((it, i) => { if (it) this.place(it, L.pos[i], o.instant && o.instant.has(it)); });
    this.content.style.width = L.w + 'px';
    this.content.style.height = L.h + 'px';
    this.updateScrolls();
  }
  place(it, p, instant) {
    if (!it.el) { it.el = this.view.mkTile(this, it); this.content.append(it.el); instant = true; }
    const s = it.el.style;
    if (instant) s.transition = 'none';
    s.width = p.w + 'px'; s.height = p.h + 'px'; s.transform = 'translate(' + p.x + 'px,' + p.y + 'px)';
    if (instant) { void it.el.offsetWidth; s.transition = ''; }
  }
  updateScrolls() {                                                    // does it scroll? (touch needs to know: see the CSS and startDrag)
    const sc = this.scroller, a = this._axis;
    const can = a === 'x' ? sc.scrollWidth > sc.clientWidth + 1 : sc.scrollHeight > sc.clientHeight + 1;
    if (can !== this.can) { this.can = can; sc.classList.toggle('can', can); }
  }
  dropEl(it) {                                                         // fade a tile out, then remove it
    const e = it.el; if (!e) return;
    it.el = null;
    e.classList.add('gone'); e.style.transform += ' scale(.8)';
    setTimeout(() => e.remove(), 330);
  }
  land(it) {                                                           // a gliding beat has arrived: show its tile at once
    it.pending = false;
    const e = it.el;
    if (!e || !e.classList.contains('pending')) return;
    e.style.transitionProperty = 'transform,width,height';             // everything but opacity: it appears, it does not fade
    e.classList.remove('pending');
    void e.offsetWidth;
    e.style.transitionProperty = '';
  }
  // Bring the end of the sequence into view. Vertical: stay glued to the bottom while the panel grows, so the scroll
  // is as smooth as the growth. Sideways: a smooth scroll.
  revealEnd() {
    const sc = this.scroller;
    if (this._axis === 'x') { sc.scrollTo({ left: sc.scrollWidth, behavior: REDUCED ? 'auto' : 'smooth' }); return; }
    if (REDUCED) { sc.scrollTop = sc.scrollHeight; return; }
    const id = ++this._pin, t0 = performance.now();
    let prev = t0;
    const step = now => {                                              // time-based, so a slow frame rate still arrives on time
      if (this._pin !== id) return;
      const dt = Math.min(100, Math.max(1, now - prev)); prev = now;
      const diff = (sc.scrollHeight - sc.clientHeight) - sc.scrollTop;
      if (Math.abs(diff) <= 1) sc.scrollTop += diff;
      else { const st = diff * (1 - Math.exp(-dt / 70)); sc.scrollTop += Math.abs(st) < 1 ? Math.sign(diff) : st; }
      if (now - t0 < 520 || Math.abs(diff) > 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  /* ----- the plan ----- */
  get beats() { return this.items.map(i => i.beat); }
  payload() { return encodePlan(this.name, this.beats); }

  addMany(beats, origin) {
    const take = beats.slice(0, Math.max(0, MAX_BEATS - this.items.length));
    if (take.length < beats.length) this.nudge();                      // full (or nearly): what does not fit is not added
    if (!take.length) return [];
    const list = take.map(beat => ({ id: uid++, beat, pending: true }));
    this.items.push.apply(this.items, list);
    this.afterAdd(list, origin, { stagger: Math.min(80, 900 / list.length) });
    return list;
  }
  addBeat(beat, origin) { return this.addMany([beat], origin)[0] || null; }
  afterAdd(list, origin, o) {
    const fly = this.visible() && !o.instant && !REDUCED;
    if (!fly) list.forEach(it => { it.pending = false; });
    this.relayout();
    if (o.reset) { this.scroller.scrollTop = 0; this.scroller.scrollLeft = 0; }
    else this.revealEnd();
    if (fly) list.forEach((it, i) => this.launch(it, origin, i * (o.stagger || 0), { skipOffscreen: !!o.reset }));
    this.changed();
  }
  launch(it, origin, delay, opts) {
    if (!origin || !this.visible()) { this.land(it); return; }
    const go = () => {
      if (it.dead) return;
      const tgt = it.el && this.view.targetEl(it, false);
      if (!tgt || !origin.isConnected) { this.land(it); return; }
      const rr = this.root.getBoundingClientRect(), or = origin.getBoundingClientRect();
      if (!or.width) { this.land(it); return; }
      if (opts && opts.skipOffscreen) {                                // beats that would land out of sight just appear
        const tr = tgt.getBoundingClientRect(), sr = this.scroller.getBoundingClientRect();
        if (tr.right < sr.left || tr.left > sr.right || tr.bottom < sr.top || tr.top > sr.bottom) { this.land(it); return; }
      }
      const s0 = Math.abs(or.width - or.height) < 2 ? or.width : 22;  // from a circle, or from a button
      const a = { x: or.left + or.width / 2 - rr.left, y: or.top + or.height / 2 - rr.top, s: s0 };
      const f = circle(it.beat); f.classList.add('flyer'); f.style.width = f.style.height = s0 + 'px';
      f.style.transform = 'translate(' + (a.x - s0 / 2) + 'px,' + (a.y - s0 / 2) + 'px)';
      this.root.append(f);
      glide(f, a, () => {
        const r = tgt.getBoundingClientRect();
        return { x: r.left + r.width / 2 - rr.left, y: r.top + r.height / 2 - rr.top, s: r.width };
      }, GLIDE_MS, () => it.dead).then(() => {
        if (it.dead) { f.style.opacity = 0; setTimeout(() => f.remove(), 300); }   // fade out, do not fly to the corner
        else { f.remove(); this.land(it); }
      });
    };
    if (delay) setTimeout(go, delay); else go();
  }
  insertBeat(beat, at) {                                               // a beat dropped from the palette
    const it = { id: uid++, beat, pending: true };
    this.items.splice(at, 0, it);
    this.relayout({ instant: new Set([it]) });
    this.changed();
    return it;
  }
  removeItem(it) {
    const i = this.items.indexOf(it); if (i < 0) return;
    this.items.splice(i, 1); it.dead = true; this.dropEl(it);
    this.relayout(); this.changed();
  }
  clear() {
    if (!this.items.length) return;
    this.items.forEach(it => { it.dead = true; this.dropEl(it); });
    this.items = [];
    this.relayout(); this.changed();
  }
  setPlan(plan, o) {                                                   // replaces the sequence (and the name)
    o = o || {};
    this.items.forEach(it => { it.dead = true; this.dropEl(it); });
    this.items = plan.beats.slice(0, MAX_BEATS).map(beat => ({ id: uid++, beat, pending: true }));
    this.setName(plan.name);
    this.afterAdd(this.items.slice(), o.origin, { instant: o.instant, reset: true, stagger: Math.min(80, 900 / Math.max(1, this.items.length)) });
  }
  loadExample(origin) { this.setPlan(EXAMPLE, { origin }); }

  /* ----- name ----- */
  onNameInput() {
    const inp = this.input, v = inp.value, s = clampUnits(v.replace(NAME_BAD, ''));
    if (s !== v) {
      const pos = Math.max(0, (inp.selectionStart || 0) - (v.length - s.length));
      inp.value = s;
      try { inp.setSelectionRange(pos, pos); } catch (e) { /* not selectable */ }
    }
    this.name = s;
    this.changed();
  }
  setName(name) { this.name = clampUnits(String(name == null ? '' : name).replace(NAME_BAD, '')); this.input.value = this.name; }

  /* ----- counter, QR, Show code ----- */
  changed() { this.refresh(); if (this.onChange) this.onChange(this); }
  refresh() {
    const n = this.items.length;
    this.nEl.textContent = n;
    this.bar.classList.toggle('empty', n === 0);
    this.codeBtn.disabled = n === 0;
    this.clBtn.disabled = n === 0;
    this.paintQR();
  }
  nudge() {                                                            // a refused add: the counter blinks once
    const c = this.countEl;
    c.classList.remove('nudge'); void c.offsetWidth; c.classList.add('nudge');
  }
  paintQR() {
    this.qrBox.dataset.payload = this.payload();                       // the QR content, readable from the page state
    const box = this.qrBox.clientWidth;
    if (box) { const info = paintQR(this.qrCanvas, makeQR(this.name, this.beats), box); this.qrBox.dataset.version = info.version; }
    if (this.overlay.classList.contains('on')) this.paintOverlay();
  }
  openCode() {
    if (!this.items.length) return;
    this.overlay.classList.add('on'); this.paintOverlay(); keepAwake(true);
  }
  closeCode() { this.overlay.classList.remove('on'); keepAwake(false); }
  paintOverlay() {
    // the Share button sits under the code, so the code never runs beneath it
    const s = Math.floor(Math.min(this.root.clientWidth, this.root.clientHeight - SHARE_ROOM));
    if (s) paintQR(this.ovCanvas, makeQR(this.name, this.beats), s, true);
  }
}

// what the name FIELD allows while you type: no ; or control characters, at most 24 UTF-16 units (no trimming: you must be able to type a space)
const NAME_BAD = /[;\u0000-\u001F\u007F-\u009F]/g;
function clampUnits(s) {
  if (s.length <= MAX_NAME) return s;
  let cut = MAX_NAME; const c = s.charCodeAt(cut - 1);
  if (c >= 0xD800 && c <= 0xDBFF) cut--;
  return s.slice(0, cut);
}

/* ---------- one drag system for everything that can be placed ----------
   A beat in the sequence (drag to reorder, drag well off to remove) or a circle from the palette (drag to place).
   While a beat is over the panel a gap opens where it will land and the others slide apart (the 98 SPEC).
   Mouse: a drag starts after 6 px. Touch: where the thing sits in something that scrolls (`hold`), a swipe scrolls
   and a press-and-hold picks it up (or a pull across the scroll axis); everywhere else 6 px starts it. */
let DRAG = null;
const SLOP = 6, HOLD_MS = 400;

function startDrag(P, kind, ev, o) {
  if (DRAG || !ev.isPrimary) return;
  if (ev.pointerType === 'mouse' && ev.button !== 0) return;
  if (kind === 'palette' && P.items.length >= MAX_BEATS) return;       // full: nothing to place
  const touch = ev.pointerType !== 'mouse';
  const d = DRAG = Object.assign({
    P, kind, pid: ev.pointerId, touch, x0: ev.clientX, y0: ev.clientY, x: ev.clientX, y: ev.clientY,
    lifted: false, moved: false, gapAt: null, out: false, hold: false, pullAxis: null, timer: 0,
  }, o);
  P._pin++;                                                             // a drag takes over the scroll
  if (touch && d.hold) d.timer = setTimeout(() => { if (DRAG === d && !d.lifted) lift(d); }, HOLD_MS);
}

function lift(d) {
  const P = d.P, view = P.view, fromTile = d.kind === 'tile';
  d.lifted = true; clearTimeout(d.timer);
  document.documentElement.classList.add('dragging');
  try { d.src.setPointerCapture(d.pid); } catch (e) { /* not capturable */ }
  d.rr = P.root.getBoundingClientRect();
  if (fromTile) {
    const r = d.item.el.getBoundingClientRect();
    d.beat = d.item.beat; d.gw = r.width; d.gh = r.height;
    d.cox = r.left + r.width / 2 - d.x0; d.coy = r.top + r.height / 2 - d.y0;   // keep the grab point
    d.item.el.classList.add('lifted');
  } else {
    const sz = view.ghostSize(P, false);
    d.gw = sz.w; d.gh = sz.h; d.cox = 0; d.coy = 0;
  }
  const g = d.ghost = view.mkGhost(P, d.beat, fromTile);
  d.k = (fromTile && P.key === 'D') ? 1.02 : 1.06;
  g.classList.add('ghost');
  g.style.width = d.gw + 'px'; g.style.height = d.gh + 'px';
  if (d.touch && !(fromTile && P.key === 'D')) {                        // a fingertip would hide a circle: carry it just above
    d.coy -= 34;
    g.style.transition = 'transform .15s ease-out,opacity .3s,filter .3s';
    setTimeout(() => { g.style.transition = ''; }, 180);
  }
  P.root.append(g);
  // targets for the gap are measured on the layout WITHOUT the lifted beat and WITHOUT a gap, so they hold still while you aim
  const rest = P.items.filter(it => it !== d.item);
  d.restN = rest.length;
  d.base = view.layout(P, rest.length, P.seqW());
  moveDrag(d);
  requestAnimationFrame(tick);
}

function bestGap(P, d) {
  const r = P.content.getBoundingClientRect(), px = d.gx - r.left, py = d.gy - r.top, cur = d.gapAt;
  let best = cur == null ? d.restN : cur, bd = Infinity;
  for (const a of P.view.anchors(P, d.base, d.restN)) {
    const dd = P.view.dist(P, a, px, py) - (a.k === cur ? 6 : 0);          // a little stickiness, so the gap does not flicker
    if (dd < bd) { bd = dd; best = a.k; }
  }
  return best;
}

function moveDrag(d) {
  const P = d.P, view = P.view;
  d.gx = d.x + d.cox; d.gy = d.y + d.coy;
  d.ghost.style.transform = 'translate(' + (d.gx - d.rr.left - d.gw / 2) + 'px,' + (d.gy - d.rr.top - d.gh / 2) + 'px) scale(' + d.k + ')';
  let gapAt = null, out = false;
  if (d.kind === 'tile') { out = view.isOut(P, d); if (!out) gapAt = bestGap(P, d); }
  else if (view.near(P, d, 24)) gapAt = bestGap(P, d);
  if (out !== d.out) {
    d.out = out;
    P.panel.classList.toggle('out', out);
    d.ghost.classList.toggle('leaving', out);
  }
  if (gapAt !== d.gapAt) { d.gapAt = gapAt; P.relayout({ gapAt, skip: d.item || null }); }
}

// a scrolling sequence scrolls by itself when a beat is held near its ends
function tick() {
  const d = DRAG;
  if (!d || !d.lifted) return;
  const P = d.P, ax = P._axis, sc = P.scroller;
  if (ax && P.can && !d.out) {
    const r = sc.getBoundingClientRect(), edge = 48, max = 12, x = ax === 'x';
    const lo = x ? r.left : r.top, hi = x ? r.right : r.bottom, p = x ? d.gx : d.gy;
    const cross = x ? d.gy : d.gx, cl = x ? r.top : r.left, ch = x ? r.bottom : r.right;
    let v = 0;
    if (cross > cl - 20 && cross < ch + 20 && p > lo - 12 && p < hi + 12) {
      if (p < lo + edge) v = -(1 - clamp((p - lo) / edge, 0, 1));
      else if (p > hi - edge) v = 1 - clamp((hi - p) / edge, 0, 1);
    }
    if (v) { if (x) sc.scrollLeft += v * max; else sc.scrollTop += v * max; moveDrag(d); }
  }
  requestAnimationFrame(tick);
}

function finish(d, cancelled) {
  const P = d.P;
  DRAG = null; clearTimeout(d.timer);
  if (!d.lifted) return;
  document.documentElement.classList.remove('dragging');
  try { d.src.releasePointerCapture(d.pid); } catch (e) { /* already released */ }
  P.noClickUntil = performance.now() + 400;
  P.panel.classList.remove('out');
  const g = d.ghost;
  if (d.kind === 'tile') {
    const it = d.item;
    if (!cancelled && d.out) {                                              // dragged off: gone
      g.classList.remove('leaving'); g.classList.add('gone'); setTimeout(() => g.remove(), 330);
      P.items.splice(P.items.indexOf(it), 1); it.dead = true;
      if (it.el) { it.el.remove(); it.el = null; }
      P.relayout(); P.changed();
      return;
    }
    const from = P.items.indexOf(it), to = (cancelled || d.gapAt == null) ? from : d.gapAt;
    if (to !== from) { P.items.splice(from, 1); P.items.splice(to, 0, it); }
    it.el.classList.remove('lifted'); it.el.classList.add('pending'); it.pending = true;
    P.relayout({ instant: new Set([it]) });
    settle(P, g, it, true);
    if (to !== from) P.changed();
    return;
  }
  if (!cancelled && !d.moved && d.tap) {                                    // picked up by a long press and put straight down: that is a tap
    g.remove(); P.relayout(); d.tap();
    return;
  }
  if (cancelled || d.gapAt == null) {                                       // from the palette, dropped away from the panel
    g.classList.add('gone'); setTimeout(() => g.remove(), 330);
    P.relayout();
    return;
  }
  settle(P, g, P.insertBeat(d.beat, d.gapAt), false);
}

// the lifted beat glides the last bit into its slot, then the real tile takes over
function settle(P, g, it, fromTile) {
  const t = P.view.targetEl(it, fromTile), r = t.getBoundingClientRect(), rr = P.root.getBoundingClientRect();
  const gw = parseFloat(g.style.width), gh = parseFloat(g.style.height);
  const to = 'translate(' + (r.left - rr.left + r.width / 2 - gw / 2) + 'px,' + (r.top - rr.top + r.height / 2 - gh / 2) + 'px) scale(' + (r.width / gw) + ')';
  const done = () => { g.remove(); P.land(it); };
  if (REDUCED) { done(); return; }
  g.classList.remove('leaving');
  const a = g.animate([{ transform: g.style.transform }, { transform: to }], { duration: 300, easing: EASE, fill: 'forwards' });
  a.onfinish = done; a.oncancel = done;
}

function cancelDrag() { if (DRAG && DRAG.lifted) finish(DRAG, true); }

addEventListener('pointermove', ev => {
  const d = DRAG;
  if (!d || ev.pointerId !== d.pid) return;
  d.x = ev.clientX; d.y = ev.clientY;
  const dx = d.x - d.x0, dy = d.y - d.y0, dist = Math.hypot(dx, dy);
  if (!d.lifted) {
    if (!d.touch) { if (dist > SLOP) lift(d); }
    else if (d.hold) {
      const pull = d.pullAxis === 'y' ? Math.abs(dy) : Math.abs(dx), along = d.pullAxis === 'y' ? Math.abs(dx) : Math.abs(dy);
      if (d.pullAxis && pull > 10 && pull > along * 1.2) lift(d);                          // pulled across the scroll axis: pick it up
      else if (dist > 10) { clearTimeout(d.timer); DRAG = null; }                          // it is a scroll: the browser has it
    } else if (dist > SLOP) lift(d);
  }
  if (d.lifted) { if (dist > SLOP) d.moved = true; moveDrag(d); }
});
addEventListener('pointerup', ev => { const d = DRAG; if (d && ev.pointerId === d.pid) finish(d, false); });
addEventListener('pointercancel', ev => { const d = DRAG; if (d && ev.pointerId === d.pid) finish(d, true); });
// once a beat is held, the finger must not scroll the page under it
addEventListener('touchmove', e => { if (DRAG && DRAG.lifted && e.cancelable) e.preventDefault(); }, { passive: false });

/* ---------- palette pieces shared by the variants ---------- */

// a palette circle with its label under it: tap or click adds, drag places
function mkCell(P, beat) {
  const b = el('button', 'cell'); b.type = 'button';
  b.setAttribute('aria-label', beat.cat.label + ', ' + beat.label);
  const c = circle(beat), l = el('span', 'lbl'); l.textContent = beat.label;
  b.append(c, l);
  const add = () => P.addBeat(beat, c);
  b.addEventListener('pointerdown', e => startDrag(P, 'palette', e, { beat, src: b, hold: true, tap: add }));
  b.addEventListener('click', () => { if (performance.now() < P.noClickUntil) return; add(); });
  return b;
}

/* A and D: every beat, grouped by category, in rows of circles (the category name sticks while you scroll) */
function paletteRows(P, host) {
  const wrap = el('div', 'pal-rows');
  CATS.forEach(cat => {
    const sec = el('section'), cells = el('div', 'cells');
    sec.append(el('div', 'catH', cat.label), cells);
    BY_CAT.get(cat.id).forEach(b => cells.append(mkCell(P, b)));
    wrap.append(sec);
  });
  host.append(wrap);
  return wrap;
}

/* ---------- C. Tabs ----------
   Category chips across the top, one category's beats at a time in a big grid (big finger targets).
   The sequence grows downward in rows and pushes the palette down, as in A (Sebastian, 2026-10-04: "I like how
   the sequence builds / pushes down in A"); it used to be one sideways-scrolling row on the phone. */

function paletteTabs(P, host) {
  const wrap = el('div', 'pal-tabs'), chips = el('div', 'chips'), gw = el('div', 'gridwrap');
  chips.setAttribute('role', 'tablist');
  let cur = null;
  // "All" first (Sebastian, 2026-10-04): every beat at once, in option A's category rows; a category tab narrows it
  // to that category's big grid.
  const tabs = [{ id: 'all', label: 'All', fill: 'var(--btn)' }].concat(CATS);
  const btns = tabs.map(tab => {
    const b = el('button', 'chip', tab.label); b.type = 'button'; b.setAttribute('role', 'tab');
    b.style.setProperty('--fill', tab.fill);
    b.addEventListener('click', () => select(tab.id));
    chips.append(b);
    return b;
  });
  function select(id) {
    if (id === cur) return;
    cur = id;
    btns.forEach((b, i) => { const on = tabs[i].id === id; b.classList.toggle('on', on); b.setAttribute('aria-selected', String(on)); });
    let g;
    if (id === 'all') {
      g = el('div', 'all');
      paletteRows(P, g);
    } else {
      g = el('div', 'grid3');
      BY_CAT.get(id).forEach(b => g.append(mkCell(P, b)));
    }
    gw.replaceChildren(g); gw.scrollTop = 0;
    requestAnimationFrame(() => fitLabels(g));
  }
  wrap.append(chips, gw); host.append(wrap);
  select('all');
}

VARIANTS.push({
  key: 'C', name: 'Tabs',
  blurb: 'Category chips (or All), one category’s beats at a time in a big grid. The sequence grows downward, as in A.',
  view: flowView({
    narrow: { tile: 52, gap: 8, pad: 12 },
    wide: { tile: 56, gap: 10, pad: 14 },
  }),
  palette: paletteTabs,
  onResize: P => { fitLabels(P.pal); fitLabels(P.pal, '.chip', 9); },
});

/* ---------- the share link: the plan you last touched, as #p=<url-encoded payload> ---------- */
const LinkSync = {
  timer: 0,
  write(P) {                                           // debounced; an empty page keeps a clean URL
    clearTimeout(this.timer);
    this.timer = setTimeout(() => {
      const empty = !P.items.length && !P.name.trim();
      try { history.replaceState(null, '', empty ? location.pathname + location.search : '#p=' + encodeURIComponent(P.payload())); }
      catch (e) { /* some file:// contexts refuse; the link is then simply not updated */ }
    }, 250);
  },
  read() {
    const m = /[#&]p=([^&]*)/.exec(location.hash);
    if (!m) return null;
    try { return decodePlan(decodeURIComponent(m[1])); } catch (e) { return null; }
  },
};

/* Share, on the code view: a link that opens this page on this plan. The phone's share sheet where there is one
   (Messages, mail, AirDrop…); otherwise the link is copied. Nothing leaves the device but what the guide shares. */
const SHARE_ROOM = 76;
function shareLink(P) { return location.href.split('#')[0] + '#p=' + encodeURIComponent(P.payload()); }
async function sharePlan(P, btn) {
  const url = shareLink(P), name = P.name.trim();
  if (navigator.share) {
    try { await navigator.share({ title: name ? 'Plan: ' + name : 'VHIL plan', url }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }      // put away: nothing to do; any other failure copies
  }
  try { await navigator.clipboard.writeText(url); }
  catch (e) { window.prompt('Copy this link', url); return; }   // no clipboard (some file:// pages): show it to copy
  btn.textContent = 'Link copied';
  clearTimeout(btn._t); btn._t = setTimeout(() => { btn.textContent = 'Share'; }, 1600);
}

const checkOnLoad = selfCheck();
if (!checkOnLoad.ok) console.error('plan builder self-check failed:', checkOnLoad.fails);

/* ---------- start (the page itself: one variant, no harness) ---------- */
const PAGE = new Page(VARIANTS[0]);
document.body.append(PAGE.root);
PAGE.onChange = p => LinkSync.write(p);

function applyHash() {                                // a #p= link opens the same plan
  const plan = LinkSync.read();
  if (plan) PAGE.setPlan(plan, { instant: true });
}
applyHash();
addEventListener('hashchange', applyHash);

addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (DRAG && DRAG.lifted) cancelDrag(); else PAGE.closeCode();
});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (PAGE.spec.onResize) PAGE.spec.onResize(PAGE); });

// handles for checking the page state from the console: __rb.page.payload(), __rb.selfCheck()
window.__rb = { page: PAGE, encodePlan, decodePlan, makeQR, cleanName, selfCheck, shareLink, BEATS, EXAMPLE, MAX_BEATS };

})();
